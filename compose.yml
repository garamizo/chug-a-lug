services:
  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    # Run as the host user so files under ./data stay owned by you (backups, cleanup, no sudo).
    user: "1000:1000"
    env_file: .env
    environment:
      WEB_INTERNAL_URL: http://web:3000
    volumes:
      - ./data/pb_data:/pb/pb_data
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
    ports:
      - "127.0.0.1:8090:8090"

  web:
    build:
      context: ./web
      args:
        PUBLIC_PB_URL: ${PUBLIC_PB_URL:?Set PUBLIC_PB_URL in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env}
      PUBLIC_PB_URL: ${PUBLIC_PB_URL:?Set PUBLIC_PB_URL in .env}
      PB_URL: http://pocketbase:8090
      DATA_DIR: /data
    volumes:
      - ./data/gtfs:/data/gtfs
      - ./data/places:/data/places
      - ./data/recordings:/data/recordings
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  # Cloudflare Tunnel connector. The tunnel's public hostnames point at the Docker service names
  # web:3000 and pocketbase:8090, which only resolve on this Compose network. Do not also run
  # cloudflared as a host systemd service: it cannot resolve those names and would take half the traffic.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web
      - pocketbase
